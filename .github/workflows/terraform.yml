name: terraform

on:
  pull_request:
  push:
    branches: [main]

# Ordre = dépendances : backend (bucket de state) -> oidc (SA, APIs, IAM) -> stacks applicatives.
jobs:
  backend:
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: backend
      sa_secret: GCP_SERVICE_ACCOUNT

  oidc:
    needs: backend
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: oidc
      sa_secret: GCP_SERVICE_ACCOUNT

  workspace:
    needs: oidc
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: workspace
      sa_secret: GCP_WORKSPACE_SERVICE_ACCOUNT
