name: terraform

on:
  pull_request:
  push:
    branches: [main]

# Le workflow appelant doit accorder au moins ce que tf-stack.yml demande.
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Terramate compare avec la base git (main sur une PR, HEAD^ sur main) et
  # liste les stacks dont les fichiers — ou les modules locaux référencés — ont changé.
  changes:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nécessaire à la détection de changements
      - uses: terramate-io/terramate-action@v3
        with:
          version: 0.17.2
          use_wrapper: false
      - id: list
        run: |
          stacks=$(terramate list --changed | jq -R . | jq -sc .)
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "Stacks modifiées : $stacks"

  # Ordre = dépendances : backend -> oidc -> {workspace, github}.
  # `!failure() && !cancelled()` : un parent *skipped* (non modifié) ne bloque pas
  # ses dépendants ; un parent en échec les bloque.
  backend:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.stacks), 'backend')
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: backend
      sa_secret: GCP_SERVICE_ACCOUNT

  oidc:
    needs: [changes, backend]
    if: ${{ !failure() && !cancelled() && contains(fromJSON(needs.changes.outputs.stacks), 'oidc') }}
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: oidc
      sa_secret: GCP_SERVICE_ACCOUNT

  workspace:
    needs: [changes, oidc]
    if: ${{ !failure() && !cancelled() && contains(fromJSON(needs.changes.outputs.stacks), 'workspace') }}
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: workspace
      sa_secret: GCP_WORKSPACE_SERVICE_ACCOUNT

  github:
    needs: [changes, oidc]
    if: ${{ !failure() && !cancelled() && contains(fromJSON(needs.changes.outputs.stacks), 'github') }}
    uses: ./.github/workflows/tf-stack.yml
    secrets: inherit
    with:
      stack: github
      sa_secret: GCP_SERVICE_ACCOUNT
      github_token_secret: GH_TF_TOKEN
